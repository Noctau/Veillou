name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Токену CI достаточно читать репозиторий
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: veillou
          POSTGRES_PASSWORD: veillou
          POSTGRES_DB: veillou_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veillou"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: veillou
      POSTGRES_PASSWORD: veillou
      TEST_POSTGRES_DB: veillou_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy
      - name: dependencies declared (deptry)
        run: uv run deptry .
      - name: migrations match models
        env:
          POSTGRES_DB: veillou_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: pytest + coverage (порог — pyproject.toml)
        run: uv run pytest --cov --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: npm ci
      # До gen-api: openapi.json не в git, сборка с чистого клона не должна от него зависеть
      - name: build from clean checkout
        run: npx vite build
      - name: API types up to date (make gen-api)
        run: |
          cd ../backend && uv sync --locked && uv run python -m scripts.dump_openapi ../frontend/openapi.json
          cd ../frontend && npx openapi-typescript openapi.json -o src/api/schema.d.ts
          git diff --exit-code -- src/api/schema.d.ts
      - run: npx oxlint
      - run: npx tsc -b --noEmit
      - run: npm test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks смотрит всю историю
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: secrets in history (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --redact --no-banner
      - name: Python dependencies (pip-audit)
        working-directory: backend
        run: |
          uv export --locked --format requirements-txt --no-hashes > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip
      - name: npm dependencies (runtime)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: bandit
        working-directory: backend
        run: uvx bandit -r app scripts -q --severity-level medium
      - name: trivy (код, конфиги, lock-файлы)
        run: >-
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.58.1 fs --quiet
          --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed
          --skip-dirs /repo/frontend/node_modules --ignorefile /repo/.trivyignore --exit-code 1 /repo

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build images
        run: |
          docker build -t veillou-backend:ci backend
          docker build -t veillou-web:ci -f infra/caddy/Dockerfile .
          docker build -t veillou-backup:ci infra/backup
      - name: scan images (trivy, только с готовым фиксом)
        run: |
          for image in veillou-backend:ci veillou-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
              image --quiet --severity CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
