name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veillou
          POSTGRES_PASSWORD: veillou
          POSTGRES_DB: veillou_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veillou"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: veillou
      POSTGRES_PASSWORD: veillou
      TEST_POSTGRES_DB: veillou_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: migrations match models
        env:
          POSTGRES_DB: veillou_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: npm ci
      # До gen-api: openapi.json не в git, сборка с чистого клона не должна от него зависеть
      - name: build from clean checkout
        run: npx vite build
      - name: API types up to date (make gen-api)
        run: |
          cd ../backend && uv sync --locked && uv run python -m scripts.dump_openapi ../frontend/openapi.json
          cd ../frontend && npx openapi-typescript openapi.json -o src/api/schema.d.ts
          git diff --exit-code -- src/api/schema.d.ts
      - run: npx oxlint
      - run: npx tsc -b --noEmit
