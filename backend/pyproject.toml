[project]
name = "veillou"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.54.0",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.1.3",
    "asyncpg>=0.32.0",
    "alembic>=1.13",
    "pwdlib[argon2]>=0.3.1",
    "aiogram>=3.31.0",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.32",
    "pywebpush>=2.5.0",
    "ortools>=9.15.6755",
    "httpx>=0.27",
    # Импортируются напрямую (а не только через fastapi / pywebpush / pydantic[email])
    "starlette>=0.46",
    "anyio>=4.6",
    "cryptography>=43",
    "requests>=2.32",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "hypothesis>=6.168.5",
    "pytest-cov>=6",
    "mypy>=1.18",
    "deptry>=0.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
strict = true
# Ловит переменную, которая в этой ветке ещё не присвоена (или осталась от другого цикла)
enable_error_code = ["possibly-undefined", "redundant-expr", "truthy-bool"]
files = ["app", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Нет type hints у библиотек
module = ["pywebpush.*", "ortools.*", "dateutil.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
# SQLAlchemy async работает через greenlet: без этого coverage не видит код после await
concurrency = ["greenlet", "thread"]
source = ["app"]
omit = ["app/ai/evals/*"]

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_covered = true

[tool.deptry]
# uvicorn — сервер (CLI), asyncpg — драйвер в DSN, python-multipart — разбор форм в FastAPI
known_first_party = ["app", "scripts"]

[tool.deptry.per_rule_ignores]
DEP002 = ["uvicorn", "asyncpg", "python-multipart"]

[tool.deptry.package_module_name_map]
python-dateutil = "dateutil"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF", "ASYNC", "PT", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках/комментариях

[tool.ruff.lint.per-file-ignores]
# assert — суть pytest; пароли и токены в тестах — фикстуры; random — генерация данных
# в property-тестах; subprocess — запуск CLI с фиксированными аргументами
"tests/**" = ["B011", "S101", "S105", "S106", "S107", "S311", "S603"]
# Тексты промптов не переносим — модели читают их как есть
"app/ai/prompts.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]
