# Прод: postgres, миграции, api, worker, bot, web (Caddy + собранный фронт), backup.
# На сервере: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Обычно не руками, а `make deploy` с мака (Docs/DEPLOY.md).
name: veillou-prod

x-backend: &backend
  build: ./backend
  image: veillou-backend
  restart: unless-stopped
  # ENV_FILE — только для проверки прод-стека на маке (Docs/DEPLOY.md §5); на сервере всегда .env
  env_file: ${ENV_FILE:-.env}
  environment:
    ENV: prod
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    STORAGE_DIR: /data/files
    SESSION_COOKIE_SECURE: "true"
    APP_URL: https://${DOMAIN:?DOMAIN не задан в .env}
  volumes:
    - files:/data/files
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    # healthcheck — из Dockerfile (GET /api/v1/health)

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    # Цикл трогает heartbeat раз в ≤10 с; ночная джоба может идти дольше — запас 5 минут
    healthcheck:
      test: ["CMD", "python", "-m", "app.heartbeat", "worker", "300"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    # + сеть llm: через её шлюз (хост) воркер ходит в SSH-туннель до домашней Ollama
    networks: [default, llm]

  bot:
    <<: *backend
    command: ["python", "-m", "app.bot"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.heartbeat", "bot", "120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    image: veillou-web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      # Пустой email ломает Caddyfile — поэтому обязателен
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL не задан в .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  backup:
    build: ./infra/backup
    image: veillou-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${DEFAULT_TIMEZONE:-Europe/Moscow}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_UID: ${BACKUP_UID:-}
      BACKUP_GID: ${BACKUP_GID:-}
    volumes:
      - files:/data/files
      - ${BACKUP_DIR:-/srv/veillou/backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:

networks:
  default:
  # Обратный SSH-туннель с домашнего компьютера слушает на шлюзе этой сети
  # (LLM_GATEWAY:11434, Docs/DEPLOY.md §6): виден только контейнерам в ней, не снаружи.
  # Имя моста — для правила ufw. Подсеть занята? Поменять здесь и в LLM_BASE_URL.
  llm:
    driver_opts:
      com.docker.network.bridge.name: veillou-llm
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
